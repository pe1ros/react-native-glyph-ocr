import java.security.MessageDigest

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/NitroPurelyOcr+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroPurelyOcr_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroPurelyOcr_" + name]).toInteger()
}

def flag(name, defaultValue) {
  def key = "PurelyOcr_" + name
  if (rootProject.ext.has(key)) return rootProject.ext.get(key).toString()
  def value = project.findProperty(key) ?: System.getenv(key)
  return value != null ? value.toString() : defaultValue
}

// ─── Build flags (docs/ocr-library-api.md, section 2) ─────────────────────
// PurelyOcr_embedPacks=eslav,cyrillic  packs of models/manifest.json to download at build time, check
//                                      by sha256 and pack into assets/ocr-models (else downloaded at runtime)
// PurelyOcr_devMlKit=true             compiles ML Kit for react-native-purely-ocr/dev (+12.5 MB, ML Kit Terms)
// PurelyOcr_executorch=auto|true|false  the minimal ExecuTorch build in android/executorch, made by
//                                      scripts/ocr-spike/executorch/build-android.sh; auto = if it is there
def embedPacks = flag("embedPacks", "").split(",").collect { it.trim() }.findAll { it }
def withMlKit = flag("devMlKit", "false").toBoolean()
def executorchDir = file("executorch")
def executorchFlag = flag("executorch", "auto")
def withExecuTorch = executorchFlag == "auto" ? new File(executorchDir, "jni/arm64-v8a/libexecutorch.so").exists() : executorchFlag.toBoolean()
if (withExecuTorch && !new File(executorchDir, "jni/arm64-v8a/libexecutorch.so").exists()) {
  throw new GradleException("[PurelyOcr] PurelyOcr_executorch=true, but ${executorchDir} has no build: run scripts/ocr-spike/executorch/build-android.sh")
}

// The manifest and the recognizer dictionaries always ship in the APK (a few KB);
// the models only for PurelyOcr_embedPacks.
def modelsDir = file("../models")
def ocrAssetsDir = file("${buildDir}/generated/purelyocr-assets")
def modelCacheDir = file("${rootProject.buildDir}/purelyocr-model-cache")

static String sha256Of(File f) {
  def md = MessageDigest.getInstance("SHA-256")
  f.withInputStream { is ->
    byte[] buf = new byte[1 << 16]
    int n
    while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
  }
  return md.digest().encodeHex().toString()
}

tasks.register("preparePurelyOcrAssets") {
  description = "Copies the OCR model manifest and dictionaries into the assets, and the models of PurelyOcr_embedPacks"
  inputs.dir(modelsDir)
  inputs.property("embedPacks", embedPacks.join(","))
  outputs.dir(ocrAssetsDir)
  doLast {
    project.delete(ocrAssetsDir)
    def manifest = new groovy.json.JsonSlurper().parse(new File(modelsDir, "manifest.json"))
    copy {
      from(new File(modelsDir, "manifest.json"))
      into(new File(ocrAssetsDir, "purelyocr"))
    }
    def files = manifest.files.collectEntries { [(it.id): it] }
    manifest.files.findAll { it.format == "dict" }.each { f ->
      def src = new File(modelsDir, f.path)
      if (sha256Of(src) != f.sha256) throw new GradleException("[PurelyOcr] ${f.path}: sha256 does not match the manifest")
      copy {
        from(src)
        into(new File(ocrAssetsDir, "ocr-models/" + new File(f.path).parent))
      }
    }
    embedPacks.each { packId ->
      def pack = manifest.packs.find { it.id == packId }
      if (pack == null) throw new GradleException("[PurelyOcr] PurelyOcr_embedPacks: no pack ${packId} in models/manifest.json")
      pack.files.collect { files[it] }.findAll { it.format == "onnx" || it.format == "ort" }.each { f ->
        modelCacheDir.mkdirs()
        def cached = new File(modelCacheDir, "${f.sha256}.${f.format}")
        if (!cached.exists() || sha256Of(cached) != f.sha256) {
          logger.lifecycle("[PurelyOcr] downloading ${f.path}")
          def tmp = new File(modelCacheDir, cached.name + ".part")
          new URL(f.url).withInputStream { is -> tmp.withOutputStream { os -> os << is } }
          def actual = sha256Of(tmp)
          if (actual != f.sha256) {
            tmp.delete()
            throw new GradleException("[PurelyOcr] ${f.path}: sha256 ${actual} != ${f.sha256}")
          }
          cached.delete()
          tmp.renameTo(cached)
        }
        def out = new File(ocrAssetsDir, "ocr-models/" + f.path)
        out.parentFile.mkdirs()
        // Packs share the detector.
        if (!out.exists()) java.nio.file.Files.copy(cached.toPath(), out.toPath())
      }
    }
  }
}
preBuild.dependsOn("preparePurelyOcrAssets")

android {
  namespace "com.margelo.nitro.purelyocr"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    buildConfigField "boolean", "PURELYOCR_EXECUTORCH", withExecuTorch.toString()
    buildConfigField "boolean", "PURELYOCR_MLKIT", withMlKit.toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libNitroModules.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  androidResources {
    // Models are read straight from the APK; compressing them only slows the first load.
    noCompress += ["onnx", "ort", "pte"]
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      assets.srcDirs += [ocrAssetsDir]
      if (withExecuTorch) {
        java.srcDirs += ["src/executorch/java", "${executorchDir}/java"]
        jniLibs.srcDirs += ["${executorchDir}/jni"]
      }
      if (withMlKit) {
        java.srcDirs += ["src/mlkit/java"]
      }
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // PaddleOCR inference (MIT): the default runtime
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.30.0"
  if (withExecuTorch) {
    // ExecuTorch (BSD-3-Clause): libexecutorch.so and its Kotlin API come from executorchDir; the API
    // needs fbjni and SoLoader's NativeLoader, the versions react-native ships.
    implementation "com.facebook.fbjni:fbjni:0.7.0"
    implementation "com.facebook.soloader:nativeloader:0.12.1"
  }
  if (withMlKit) {
    // ML Kit Text Recognition v2, Latin script, model bundled into the APK (/dev only)
    implementation "com.google.mlkit:text-recognition:16.0.1"
  }
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
